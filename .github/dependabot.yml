# Dependabot — automated dependency update PRs.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # npm dependencies (Angular + dev tooling).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    reviewers:
      - justice8096
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      # All @angular/* packages must move together — @angular/cli at vN
      # requires @angular/core, @angular/common, @angular/material,
      # @angular/cdk, @angular/animations, @angular/forms, @angular/router,
      # @angular/platform-browser, @angular/platform-browser-dynamic,
      # @angular/compiler, @angular/compiler-cli, and @angular/build
      # at matching vN. Attempting a partial bump (e.g. CLI alone) always
      # fails at build time.
      #
      # This group captures BOTH @angular/* (the runtime + tooling family)
      # AND @angular-* (meta-packages like @angular-devkit/*) so every
      # Angular-major upgrade arrives as one coordinated PR across 10+
      # packages — matching what `ng update` would produce locally.
      angular-family:
        patterns:
          - "@angular/*"
          - "@angular-*"
          - "zone.js"        # Angular runtime dep; moves with major versions
          - "rxjs"           # Angular peer dep; should be validated with upgrades
          - "typescript"     # Angular 19 supports TS 5.5–5.8 only; TS 6 requires Angular 21+
        update-types:
          - "major"
          - "minor"
          - "patch"
      dev-tooling:
        dependency-type: development
        patterns:
          - "@types/*"
        exclude-patterns:
          # @types/* for Angular is already inside angular-family if prefixed,
          # but common ones like @types/leaflet / @types/node stay here.
          - "@types/leaflet"

  # GitHub Actions — weekly tag updates (SHAs are required per repo policy).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - justice8096
    commit-message:
      prefix: chore(ci)
