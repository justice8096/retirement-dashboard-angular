name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Angular 22 requires Node >= 22.22.3 (or 24/26); Node 20 is dropped.
        node-version: [22, 24]
    defaults:
      run:
        # package.json depends on "@retirement/shared": "file:../retirement-api/shared"
        # (Monte Carlo engine consolidation, B4). CI checks out both repos as
        # siblings below, so every `run:` step in this job executes from rda/
        # with retirement-api/ one level up — matching local dev layout.
        working-directory: rda

    steps:
      - name: Checkout dashboard (this repo)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rda

      - name: Checkout retirement-api (sibling, for @retirement/shared)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: justice8096/retirement-api
          path: retirement-api

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: rda/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build (development)
        run: npx ng build --configuration development

      # Production build also runs in PR CI so bundle-budget overruns
      # are caught before merge. Without this, only the main-branch
      # `provenance` job exercises production, and PR signal is green
      # for builds that actually fail on main.
      - name: Build (production)
        run: npx ng build --configuration production

      - name: Readability lint
        # Dyslexia audit DFA-2026-04-19-004 — flags prose above grade 9.
        # Warn-only for now; promote to --fail-on-exceed once baseline is clean.
        run: node scripts/check-readability.mjs

      - name: Numeric-input coverage
        # Fails if any <input type="number"> lacks the appNumeric directive —
        # guardrail after the 2026-04-20 dyscalculia sweep (FU-002/004/007/011/013/019).
        run: npm run check:numeric-inputs

      - name: Font-scale coverage
        # Fails if any stylesheet font-size is a bare px value that ignores
        # the --font-scale accessibility setting (2026-08-22 sweep).
        run: npm run check:font-scale

      - name: Verify withdrawal apportionment math
        # Regression-tests the apportion() logic in src/app/lib/apportion.ts
        # against 14 canonical cases. Exits 1 on any divergence.
        run: npm run verify:apportion

  sbom:
    runs-on: ubuntu-latest
    defaults:
      run:
        # See build-and-check: @retirement/shared resolves via the sibling
        # retirement-api/ checkout below.
        working-directory: rda
    steps:
      - name: Checkout dashboard (this repo)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rda
      - name: Checkout retirement-api (sibling, for @retirement/shared)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: justice8096/retirement-api
          path: retirement-api
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rda/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          # upload-artifact resolves `path:` from $GITHUB_WORKSPACE, not the
          # job's `defaults.run.working-directory` (that only applies to
          # `run:` steps) — so this must be rda-relative.
          path: rda/sbom.json
          retention-days: 90

  # SLSA L2 — build provenance attestation signed with Sigstore + OIDC.
  # Runs only on main-branch pushes (not PRs) because attestations need
  # id-token:write which is not granted to fork PRs. Produces a verifiable
  # claim linking the dashboard's built bundle to this exact source +
  # workflow run, queryable via `gh attestation verify dist/...`.
  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # Sigstore OIDC signing
      attestations: write    # GitHub attestation store
      contents: read
    defaults:
      run:
        # See build-and-check: @retirement/shared resolves via the sibling
        # retirement-api/ checkout below.
        working-directory: rda
    steps:
      - name: Checkout dashboard (this repo)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rda
      - name: Checkout retirement-api (sibling, for @retirement/shared)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: justice8096/retirement-api
          path: retirement-api
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rda/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (production)
        run: npx ng build --configuration production
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          # subject-path is resolved from $GITHUB_WORKSPACE, not the job's
          # working-directory default — must be rda-relative. Also,
          # actions/glob has no brace expansion — {js,css,html} silently
          # matched nothing (the job failed on every main push since the
          # Angular 22 upgrade moved output under browser/). One pattern
          # per line instead.
          subject-path: |
            rda/dist/retirement-dashboard/**/*.js
            rda/dist/retirement-dashboard/**/*.css
            rda/dist/retirement-dashboard/**/*.html

  security-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        # See build-and-check: @retirement/shared resolves via the sibling
        # retirement-api/ checkout below.
        working-directory: rda
    steps:
      - name: Checkout dashboard (this repo)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rda

      - name: Checkout retirement-api (sibling, for @retirement/shared)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: justice8096/retirement-api
          path: retirement-api

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rda/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan (runtime only — dev-dep CVEs accepted until Angular 19->21)
        run: npm audit --production --audit-level=high

      - name: Check for hardcoded secrets
        run: |
          if grep -rnE 'sk_(test|live)_[A-Za-z0-9]{15,}|whsec_[A-Za-z0-9]{15,}|pk_live_[A-Za-z0-9]{15,}' \
            --include='*.ts' --include='*.js' --include='*.mjs' --include='*.json' --include='*.html' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.angular \
            src/ scripts/ 2>/dev/null; then
            echo '::error::Potential secrets found in source tree'
            exit 1
          fi
          echo "No secrets detected."

      - name: Check for unsafe DOM sinks
        run: |
          if grep -rnE '\[innerHTML\]|bypassSecurityTrust' \
            --include='*.ts' --include='*.html' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.angular \
            src/ 2>/dev/null; then
            echo '::warning::Unsafe DOM sink pattern detected — review manually.'
          fi

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

  docker-security:
    # Mirrors retirement-api's docker-security job — hadolint on every PR
    # touching the Dockerfile catches lint issues before the rogue deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
        continue-on-error: true
