name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build (development)
        run: npx ng build --configuration development

      - name: Readability lint
        # Dyslexia audit DFA-2026-04-19-004 — flags prose above grade 9.
        # Warn-only for now; promote to --fail-on-exceed once baseline is clean.
        run: node scripts/check-readability.mjs

      - name: Verify withdrawal apportionment math
        # Regression-tests the apportion() logic in src/app/lib/apportion.ts
        # against 14 canonical cases. Exits 1 on any divergence.
        run: npm run verify:apportion

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

  # SLSA L2 — build provenance attestation signed with Sigstore + OIDC.
  # Runs only on main-branch pushes (not PRs) because attestations need
  # id-token:write which is not granted to fork PRs. Produces a verifiable
  # claim linking the dashboard's built bundle to this exact source +
  # workflow run, queryable via `gh attestation verify dist/...`.
  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # Sigstore OIDC signing
      attestations: write    # GitHub attestation store
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (production)
        run: npx ng build --configuration production
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/retirement-dashboard/**/*.{js,css,html,map}

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan (runtime only — dev-dep CVEs accepted until Angular 19->21)
        run: npm audit --production --audit-level=high

      - name: Check for hardcoded secrets
        run: |
          if grep -rnE 'sk_(test|live)_[A-Za-z0-9]{15,}|whsec_[A-Za-z0-9]{15,}|pk_live_[A-Za-z0-9]{15,}' \
            --include='*.ts' --include='*.js' --include='*.mjs' --include='*.json' --include='*.html' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.angular \
            src/ scripts/ 2>/dev/null; then
            echo '::error::Potential secrets found in source tree'
            exit 1
          fi
          echo "No secrets detected."

      - name: Check for unsafe DOM sinks
        run: |
          if grep -rnE '\[innerHTML\]|bypassSecurityTrust' \
            --include='*.ts' --include='*.html' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.angular \
            src/ 2>/dev/null; then
            echo '::warning::Unsafe DOM sink pattern detected — review manually.'
          fi

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
