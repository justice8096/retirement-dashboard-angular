<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Retirement Planning Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CSP allows Clerk auth (script-src + frame-src + connect-src for *.clerk.accounts.dev
       and *.clerk.com), tile imagery for the Locations Map, and OpenDyslexic at jsdelivr.
       Same-origin /api/* is reverse-proxied by nginx, so the prior split-origin localhost
       entries are no longer needed. frame-ancestors is ignored when delivered via <meta> —
       enforce it as an HTTP header in nginx if iframing protection matters. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://*.clerk.com https://*.clerk.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.openstreetmap.org https://*.basemaps.cartocdn.com https://img.clerk.com; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com https://*.clerk.dev https://challenges.cloudflare.com; frame-src https://*.clerk.accounts.dev https://*.clerk.com https://*.clerk.dev https://challenges.cloudflare.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- OpenDyslexic (self-hosted at jsdelivr). Falls back to Atkinson/Inter when offline.
       DFA-2026-04-19-006: 400 + 700 so bold/headings render in-family instead of
       faux-bolding the 400 weight (visually breaks OpenDyslexic's heavy baselines). -->
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.1.0/400.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.1.0/700.css" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
