server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (added 2026-05-10 — closes retirement-monitor-report-2026-03-31
    # findings header-x-frame-options, header-x-content-type, header-referrer-policy,
    # header-permissions-policy, plus frame-ancestors enforcement that the index.html
    # meta CSP cannot deliver).
    #
    # The comprehensive CSP (script-src, style-src, connect-src for Clerk + fonts +
    # OSM tiles etc.) lives in index.html <meta> and stays there — only frame-ancestors
    # needs HTTP delivery because <meta>-delivered CSPs cannot enforce that directive.
    #
    # NOTE: nginx add_header inheritance — directives at the server level are inherited
    # by locations only if those locations have no add_header of their own. Since the
    # static-asset + SPA-fallback locations below already use add_header Cache-Control,
    # the security headers must be re-emitted there. /api/ and /healthz have no
    # add_header and inherit cleanly.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Long cache for hashed assets emitted by @angular/build
    # (filenames carry content hashes, so 1y immutable is safe).
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-emit server-level security headers — nginx inheritance is suppressed by
        # the Cache-Control add_header above.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # API reverse proxy — `api` is the docker-compose service name.
    # Dashboard fetches `/api/*` against its own origin so we sidestep CORS
    # and Tailscale Funnel exposes a single host.
    #
    # Re-resolve the upstream on every request via Docker's embedded DNS
    # (127.0.0.11) instead of caching at nginx startup. Without this, when
    # the api container is recreated (e.g. `docker compose up -d api` after
    # an env change) it gets a new IP, and nginx keeps proxying to the dead
    # old IP, returning 502 until dashboard is also restarted. The variable
    # `$api_upstream` forces nginx to look up the name on each request.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream "api:3000";
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;

        # Strip the upstream API's helmet-emitted security headers so the dashboard
        # nginx's stricter server-level ones (X-Frame-Options DENY, frame-ancestors
        # 'none', etc.) are the single authoritative source. Without these hides,
        # the browser sees two conflicting values (e.g. SAMEORIGIN from helmet AND
        # DENY from nginx); modern browsers honor the strictest so it's not
        # regressive, but duplicate X-Frame-Options is technically non-conformant
        # and clutters response headers.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    # SPA fallback — never cache index.html so deploys take effect immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Re-emit server-level security headers — nginx inheritance is suppressed by
        # the Cache-Control add_header above.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Lightweight health endpoint for the docker HEALTHCHECK and Uptime Kuma.
    # `default_type` (not `add_header Content-Type`) so the response has
    # exactly ONE Content-Type. add_header *appends* to nginx's auto-set
    # `application/octet-stream` (default for inline string bodies),
    # producing two Content-Type headers in the response — and some HTTP
    # clients (notably Uptime Kuma's axios) treat duplicate Content-Type
    # as a malformed response and reject with redirect-loop / parse errors.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
