server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets emitted by @angular/build
    # (filenames carry content hashes, so 1y immutable is safe).
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy — `api` is the docker-compose service name.
    # Dashboard fetches `/api/*` against its own origin so we sidestep CORS
    # and Tailscale Funnel exposes a single host.
    #
    # Re-resolve the upstream on every request via Docker's embedded DNS
    # (127.0.0.11) instead of caching at nginx startup. Without this, when
    # the api container is recreated (e.g. `docker compose up -d api` after
    # an env change) it gets a new IP, and nginx keeps proxying to the dead
    # old IP, returning 502 until dashboard is also restarted. The variable
    # `$api_upstream` forces nginx to look up the name on each request.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream "api:3000";
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # SPA fallback — never cache index.html so deploys take effect immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Lightweight health endpoint for the docker HEALTHCHECK and Uptime Kuma.
    # `default_type` (not `add_header Content-Type`) so the response has
    # exactly ONE Content-Type. add_header *appends* to nginx's auto-set
    # `application/octet-stream` (default for inline string bodies),
    # producing two Content-Type headers in the response — and some HTTP
    # clients (notably Uptime Kuma's axios) treat duplicate Content-Type
    # as a malformed response and reject with redirect-loop / parse errors.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
